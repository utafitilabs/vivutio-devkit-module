name: The fleet gate

# The gate as a workflow every repository of the platform calls: in head mode
# over the version lines (or the exact commits a release is about to tag), in
# released mode over what Packagist hands out. A host installation is made from
# the skeleton with this kit in it, and the gate creates a project from nothing
# beside it.
#
# https://docs.github.com/en/actions/sharing-automations/reusing-workflows

on:
  workflow_call:
    inputs:
      mode:
        description: head or released
        type: string
        required: true
      core-ref:
        type: string
        default: '0.1'
      skeleton-ref:
        type: string
        default: '0.1'
      devkit-ref:
        type: string
        default: '0.1'
      property-ref:
        type: string
        default: '0.1'
      front-desk-ref:
        type: string
        default: '0.1'
      touring-ref:
        type: string
        default: '0.1'
      sourcing-ref:
        type: string
        default: '0.1'
      ticketing-ref:
        type: string
        default: '0.1'
      payment-ref:
        type: string
        default: '0.1'
      supplier-pack-ref:
        type: string
        default: '0.1'
      operator-pack-ref:
        type: string
        default: '0.1'
      agency-pack-ref:
        type: string
        default: '0.1'
      expect-repository:
        description: In a release, the checkout whose head must be the commit about to be tagged
        type: string
        default: ''
      expect-sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gate:
    name: fleet:gate --mode=${{ inputs.mode }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-devkit-module
          ref: ${{ inputs.devkit-ref }}
          path: fleet/vivutio-devkit-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio
          ref: ${{ inputs.core-ref }}
          path: fleet/vivutio

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-skeleton
          ref: ${{ inputs.skeleton-ref }}
          path: fleet/vivutio-skeleton

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-property-module
          ref: ${{ inputs.property-ref }}
          path: fleet/vivutio-property-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-front-desk-module
          ref: ${{ inputs.front-desk-ref }}
          path: fleet/vivutio-front-desk-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-touring-module
          ref: ${{ inputs.touring-ref }}
          path: fleet/vivutio-touring-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-sourcing-module
          ref: ${{ inputs.sourcing-ref }}
          path: fleet/vivutio-sourcing-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-ticketing-module
          ref: ${{ inputs.ticketing-ref }}
          path: fleet/vivutio-ticketing-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-payment-module
          ref: ${{ inputs.payment-ref }}
          path: fleet/vivutio-payment-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-supplier-pack
          ref: ${{ inputs.supplier-pack-ref }}
          path: fleet/vivutio-supplier-pack

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-operator-pack
          ref: ${{ inputs.operator-pack-ref }}
          path: fleet/vivutio-operator-pack

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-agency-pack
          ref: ${{ inputs.agency-pack-ref }}
          path: fleet/vivutio-agency-pack

      # The checkouts are of lines, by name, so every version reads as the
      # line's; a release then insists the line still stands where it was
      # dispatched, so the commit the gate passes is the one that is tagged.
      - name: The line has not moved since the release was asked for
        if: inputs.expect-sha != ''
        env:
          REPOSITORY: ${{ inputs.expect-repository }}
          EXPECTED: ${{ inputs.expect-sha }}
        run: |
          head=$(git -C "fleet/$REPOSITORY" rev-parse HEAD)
          [ "$head" = "$EXPECTED" ] || { echo "::error::$REPOSITORY's line is at $head, not $EXPECTED: dispatch the release again"; exit 1; }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      # The host only runs the gate; in released mode the project the gate
      # judges comes from Packagist, never from these checkouts.
      - name: A host installation with this kit
        run: |
          cp -R fleet/vivutio-skeleton host && rm -rf host/.git
          cd host
          echo 'DATABASE_URL="postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8"' > .env.local
          composer config repositories.core '{"type":"path","url":"../fleet/vivutio","options":{"symlink":false}}'
          composer config repositories.devkit '{"type":"path","url":"../fleet/vivutio-devkit-module"}'
          composer require --no-interaction --no-progress "vivutio/vivutio:0.1.x-dev as 0.1.0"
          composer require --dev --no-interaction --no-progress "vivutio/devkit-module:*@dev"
          sed -i "s/^];/    Vivutio\\\\Devkit\\\\VivutioDevkitBundle::class => ['dev' => true, 'test' => true],\n];/" config/bundles.php
          # What the fleet is made of: the official modules, each with its first page,
          # and the packs that bring them.
          mkdir -p config/packages
          printf '%s\n' 'devkit:' '    fleet:' "        official_modules: ['property', 'front-desk', 'touring', 'sourcing', 'ticketing', 'payment']" "        after_migrate: ['doctrine:migrations:migrate']" '        modules:' "            property: { page: 'property_list' }" "            front-desk: { page: 'front_desk_places' }" "            touring: { page: 'touring_tours' }" "            sourcing: { page: 'sourcing_requests' }" "            ticketing: { page: 'ticketing_tickets' }" "            payment: { page: 'payment_charges' }" '        packs:' "            supplier: ['property']" "            operator: ['touring', 'sourcing']" "            agency: ['ticketing', 'sourcing']" > config/packages/devkit.yaml
          # A file new to config/packages is not among the resources the
          # compiled container checks, so composer's own cache:clear of a
          # moment ago would be kept: the cache is removed and built again.
          rm -rf var/cache && php bin/console cache:warmup
          # A gate that installs nothing passes on nothing.
          php bin/console fleet:gate --mode=released --dry-run --database-url='postgresql://app:app@127.0.0.1:5432/fleet_gate' | grep -q 'modules    vivutio/' || { echo "::error::the gate's host reads no official modules"; exit 1; }

      - name: fleet:gate --mode=${{ inputs.mode }}
        working-directory: host
        run: |
          if [ '${{ inputs.mode }}' = head ]; then
            php bin/console fleet:gate --mode=head --workspace="$GITHUB_WORKSPACE/fleet" --database-url='postgresql://app:app@127.0.0.1:5432/fleet_gate?serverVersion=17&charset=utf8'
          else
            php bin/console fleet:gate --mode=released --keep --database-url='postgresql://app:app@127.0.0.1:5432/fleet_gate?serverVersion=17&charset=utf8' | tee gate.log
            # A green gate over an older release is not a pass: say what it installed.
            project=$(sed -n 's/.*kept \(.*\)$/\1/p' gate.log | tail -1 | tr -d ' ')
            echo "The released gate installed:" >> "$GITHUB_STEP_SUMMARY"
            (cd "$project" && composer show 'vivutio/*' --format=text) | tee -a "$GITHUB_STEP_SUMMARY"
          fi
