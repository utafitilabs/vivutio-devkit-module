name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      # `update`: a bundle is tested against what its constraints allow, and its
      # lock is not committed.
      - run: composer update --no-interaction --no-progress
      - run: composer check

  # The gate itself, in head mode, over the platform's current lines: a host
  # installation is made from the skeleton with this kit in it, and the gate
  # creates a project from nothing beside it.
  gate:
    name: The fleet gate, head mode
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet/vivutio-devkit-module

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio
          ref: '0.1'
          path: fleet/vivutio

      - uses: actions/checkout@v4
        with:
          repository: utafitilabs/vivutio-skeleton
          ref: '0.1'
          path: fleet/vivutio-skeleton

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: A host installation with this kit
        run: |
          cp -R fleet/vivutio-skeleton host && rm -rf host/.git
          cd host
          echo 'DATABASE_URL="postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8"' > .env.local
          composer config repositories.core '{"type":"path","url":"../fleet/vivutio","options":{"symlink":false}}'
          composer config repositories.devkit '{"type":"path","url":"../fleet/vivutio-devkit-module"}'
          composer require --no-interaction --no-progress "vivutio/vivutio:0.1.x-dev as 0.1.0"
          composer require --dev --no-interaction --no-progress "vivutio/devkit-module:*@dev"
          sed -i "s/^];/    Vivutio\\\\Devkit\\\\VivutioDevkitBundle::class => ['dev' => true, 'test' => true],\n];/" config/bundles.php
          php bin/console cache:clear

      - name: fleet:gate --mode=head
        working-directory: host
        run: php bin/console fleet:gate --mode=head --workspace="$GITHUB_WORKSPACE/fleet" --database-url='postgresql://app:app@127.0.0.1:5432/fleet_gate?serverVersion=17&charset=utf8'
