name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      # `update`: a bundle is tested against what its constraints allow, and its
      # lock is not committed.
      - run: composer update --no-interaction --no-progress
      - run: composer check

  # The gate itself, in head mode, over the platform's current lines.
  gate:
    uses: ./.github/workflows/fleet-gate.yml
    with:
      mode: head
